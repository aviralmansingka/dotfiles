theme = "gruvbox-material"

# Match Neovim's gruvbox-material settings: dark, medium background, mix foreground.
[themes.gruvbox-material]
base = "gruvbox-dark-medium"
label = "Gruvbox Material"
background = "#282828"
panel = "#282828"
panelAlt = "#282828"
border = "#5a524c"
accent = "#80aa9e"
accentMuted = "#374141"
text = "#e2cca9"
muted = "#928374"
addedBg = "#34381b"
removedBg = "#402120"
movedAddedBg = "#0e363e"
movedRemovedBg = "#0e363e"
contextBg = "#282828"
addedContentBg = "#3b4439"
removedContentBg = "#4c3432"
contextContentBg = "#282828"
addedSignColor = "#b0b846"
removedSignColor = "#f2594b"
lineNumberBg = "#282828"
lineNumberFg = "#7c6f64"
selectedHunk = "#374141"
badgeAdded = "#b0b846"
badgeRemoved = "#f2594b"
badgeNeutral = "#928374"
fileNew = "#b0b846"
fileDeleted = "#f2594b"
fileRenamed = "#8bba7f"
fileModified = "#f28534"
fileUntracked = "#e9b143"
noteBorder = "#d3869b"
noteBackground = "#282828"
noteTitleBackground = "#443840"
noteTitleText = "#e2cca9"

[themes.gruvbox-material.syntax_scopes]
"comment" = "#928374"
"punctuation.definition.comment" = "#928374"
"keyword" = "#f2594b"
"keyword.control" = "#f2594b"
"keyword.operator" = "#f28534"
"storage" = "#f28534"
"storage.type" = "#f28534"
"storage.modifier" = "#f28534"
"string" = "#8bba7f"
"string.tag" = "#8bba7f"
"string.value" = "#8bba7f"
"string.escape" = "#b0b846"
"string.regexp" = "#b0b846"
"constant" = "#e2cca9"
"constant.numeric" = "#d3869b"
"constant.language.boolean" = "#d3869b"
"entity.name.function" = "#b0b846"
"entity.name.method" = "#b0b846"
"support.function" = "#b0b846"
"entity.name.type" = "#e9b143"
"support.type" = "#e9b143"
"variable" = "#e2cca9"
"variable.parameter" = "#e2cca9"
"variable.other.property" = "#80aa9e"
"entity.other.attribute-name" = "#b0b846"
"meta.preprocessor" = "#d3869b"
"punctuation" = "#e2cca9"
