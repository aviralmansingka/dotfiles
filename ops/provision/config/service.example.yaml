# Example non-secret service configuration for the fleet provisioning API.
#
# Copy to /etc/fleet-provision/service.yaml and adjust the paths. This file holds
# NO credential values: only file paths and OpenBao *references*. Client bearer
# tokens are stored as SHA-256 digests in the tokens file (mode 0600); the
# plaintext token lives in the operator's mode-0600 curl config.
#
# Publication model: the backend binds to loopback and is published only through
# Tailscale Serve on the tailnet hostname (https://provision.<tailnet>.ts.net).
# Tailscale Serve terminates TLS, so the loopback hop needs no certificate. Set
# api.tls.cert_file/key_file if you front it with a real certificate instead;
# binding off loopback requires both TLS files and allow_non_loopback: true.
api:
  listen: 127.0.0.1:8080
  allow_non_loopback: false
  tls:
    cert_file: ""
    key_file: ""

temporal:
  host_port: 127.0.0.1:7233
  namespace: fleet-provision
  task_queue: fleet-provision

storage:
  # Durable host inventory and idempotency reservations. Job execution lives in
  # Temporal; S06 moves this document to PostgreSQL.
  state_file: /var/lib/fleet-provision/store.json

tokens:
  # YAML document with client_id, token_sha256 (64 hex), description, revoked.
  # Mode 0600; at least one digest is required.
  file: /etc/fleet-provision/tokens.yaml

profiles_file: /etc/fleet-provision/profiles.yaml

limits:
  max_concurrent_jobs: 4
  terraform_state_locks: 1
  max_concurrent_provisioning: 2

providers:
  aws:
    # The only approved region. Anything else is refused at load time and again
    # by the provider adapter.
    region: ap-south-1
    credentials:
      # Credentials are acquired inside activities from OpenBao. These are
      # references, never values, and never reach a workflow payload.
      kind: openbao_approle
      role_id_ref: bao:kv/homelab/provision/aws/role-id
      secret_id_ref: bao:kv/homelab/provision/aws/secret-id
    bootstrap:
      # Where the operator keeps the approved SSH source CIDR (OpenBao, as a
      # reference — never a value in this document).
      ssh_source_ref: bao:kv/homelab/provision/bootstrap/ssh-source-cidr
      # Approved bootstrap SSH source (homelab egress). Optional: leave it empty
      # (the zero-ingress default) and the host gets NO ingress rule at all —
      # the tailnet is the only way in, and enrollment has no SSH path. Set one
      # CIDR when the enrollment chain needs the trusted-SSH bootstrap. Never
      # 0.0.0.0/0 or ::/0: anything wider than /8, and both wildcards, are
      # refused at load time and again by the Terraform variables.
      ssh_source_cidr: ""
      # A .pub file. The adapter reads it and refuses private key material; no
      # key material is stored in this document.
      ssh_public_key_file: /etc/fleet-provision/ssh/host-bootstrap.pub
    terraform:
      # The isolated per-host entry point. Read-only: the worker copies these
      # files into <run_dir>/<host> and runs Terraform there, so no two hosts
      # share a working directory or a state object.
      dir: /opt/fleet-provision/terraform/aws
      run_dir: /var/lib/fleet-provision/terraform-runs
      binary: terraform
      timeout_seconds: 1800
      # Owner-approved network: the dedicated fleet VPC that
      # ops/provision/terraform/aws-network creates once, before any host
      # (vpc 10.99.0.0/16, subnet 10.99.1.0/24 in ap-south-1a). Both values are
      # required and neither falls back to a default VPC: this account has no
      # default VPC in ap-south-1, and an implicit lookup would silently pick the
      # wrong network. The owner chooses these; no client request can.
      vpc_id: vpc-0123456789abcdef0
      subnet_id: subnet-0123456789abcdef0
      # State: the existing dotfiles bucket, one object per host at
      # fleet-hosts/<host>/terraform.tfstate. state_region is the bucket's own
      # region, not the resource region.
      state_bucket: aviral-dotfiles-terraform-state
      state_region: us-east-1
      # `owner` and `fleet-test-run` tag values on every taggable resource, so an
      # acceptance run can find and destroy exactly its own hosts.
      owner_tag: homelab
      test_run_tag: manual

enrollment:
  # Trusted-SSH enrollment (S03). The tailnet tag is not here on purpose: it comes
  # from the approved profile in profiles.yaml, so no request and no config value
  # outside the profile can choose it.
  tailscale:
    base_url: https://api.tailscale.com
    # "-" means the tailnet the OAuth client belongs to.
    tailnet: "-"
    # Public client id. The client secret is read from OpenBao through the
    # reference below, at call time, and only into the token request body.
    oauth_client_id: kExampleClientId
    oauth_secret_ref: bao:secret/data/fleet/tailscale-oauth
  openbao:
    address: http://127.0.0.1:8200
    # Mode 0600, read once at start-up. No token value appears in this file.
    token_file: /etc/fleet-provision/openbao-token
  ssh:
    # Path of the operator's bootstrap login key. The service passes the path to
    # ssh -i and never reads, copies, or logs the key itself.
    identity_file: /etc/fleet-provision/ssh/bootstrap_ed25519
    # One private known_hosts file per enrollment is written here, mode 0600.
    known_hosts_dir: /run/fleet-provision/known-hosts
    # Delivered over stdin, mode 0600, removed on success and on failure.
    remote_key_path: /run/fleet-enroll/auth-key

logging:
  level: info
  format: json
