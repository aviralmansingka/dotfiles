# Approved host profiles for the private fleet provisioning API.
#
# The API accepts only the profile, region, and size *names* below. Every
# concrete value (instance type, disk size, tags, secret-bundle references, flake
# target) is resolved from this file, so a client cannot choose an executable, a
# flake URL, an OpenBao path, a Terraform state path, or an IAM role.
#
# secret_bundles is a per-host bundle mapping: a bundle name to a KV path
# template. The single {host} placeholder is replaced with the host's generated
# identity, so every host derives its own path under secret/data/hosts/<host>/ and
# two hosts can never share one. A literal shared path is refused at load time.
# No secret value ever appears in this file, in a job record, or in a workflow
# payload.
profiles:
  - name: rex
    display_name: Managed Rex host
    provider: aws
    regions:
      - ap-south-1
    sizes:
      # Logical size -> approved instance shape. S02 may add "large" once the
      # cost estimate is approved; nothing else has to change.
      standard:
        instance_type: t3.medium
        disk_gb: 40
    tags:
      owner: homelab
      fleet-tier: managed
      fleet-provider: aws
    secret_bundles:
      # Bundle name -> per-host path template. The host gets read access to
      # exactly this tree and nothing else; the canary is the approved
      # non-sensitive sentinel the acceptance check reads.
      canary: bao:secret/data/hosts/{host}/canary
    # Approved flake target for this logical profile. This is the one definition
    # of the mapping: the API's `rex` profile is built by
    # `homeConfigurations.remote-mumbai`, whose shared Rex configuration is
    # nix/modules/remote/rex-host.nix. The flake ref stays server-side, and
    # internal/config/profiles_flake_test.go asserts it names an output the flake
    # actually exposes.
    #
    # The reference is fully qualified and revision-pinned. A provisioned host
    # has no checkout, so a relative `.#...` target cannot resolve there, and a
    # branch name could move between the review and the deploy, so the deploy
    # needs the exact commit it activates: the full 40-character SHA, in
    # `git+https` form (the branch name contains a slash, which the `github:`
    # shorthand cannot carry with an exact rev). The operator must push the
    # commit before a deploy, or the revision is not reachable on the remote and
    # the host cannot fetch it.
    flake_ref: git+https://github.com/aviralmansingka/dotfiles?rev=704777b201e001fa6883426bd1205f1f18494f75#homeConfigurations.remote-mumbai.activationPackage
    # Tailnet tag every host of this profile joins with. This is the only source
    # of a tag: a create request has no field for one, the enrollment key is
    # minted with exactly this tag, and the device lookup searches by it, so a
    # retry finds the host it already registered instead of minting a second.
    tailnet_tag: tag:aws-host
