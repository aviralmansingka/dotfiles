#cloud-config
# Public bootstrap for a fleet host (S02 prerequisites, S03 tailscaled, S04 SSM
# enrollment prerequisites).
#
# This file installs Nix prerequisites, the multi-user Nix daemon, the system
# `tailscaled` daemon, and the AWS CLI the host needs to read its own enrollment
# parameter. It contains no secret, no token, no enrollment key, no auth key, and
# no tailnet tag: the provisioning service mints a single-use key later, stores it
# as an encrypted SSM parameter, and runs `tailscale up` over SSM Run Command from
# the worker. Nothing here opens, or needs, an inbound connection.
#
# The whole bootstrap is ONE runcmd shell (a block scalar) with `set -eu` and an
# explicit root environment. cloud-init runs runcmd with `/bin/sh` and no login
# environment, so HOME is unset; the upstream Nix installer aborts with
# `$HOME is not set` on a real Ubuntu host, and a list of independent `runcmd`
# entries let that failure be swallowed while the run still reported success.
# Every install step below ends with a check that can fail the boot.
#
# `set -euo pipefail` was a live defect, not a preference: cloud-init writes its
# runcmd script with `#!/bin/sh`, which is dash on Ubuntu, and dash rejects
# `set -o pipefail` with exit 2 before the block's first real line. The first host
# (fleet-s02-20261126t1015) booted with cloud-init status "error", no `nix`, no
# `tailscaled`, and no `aws`, and cloud-init's own log line was
# `/var/lib/cloud/instance/scripts/runcmd: 2: set: Illegal option -o pipefail`.
# The block is therefore POSIX sh: `set -eu`, no `pipefail`, no `[[`, no arrays.
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - git
  - iptables
  - xz-utils

write_files:
  # Flakes and the Nix command line, so `just deploy remote <host>` needs no
  # manual edit on the box.
  - path: /etc/nix/nix.conf
    owner: root:root
    permissions: "0644"
    content: |
      experimental-features = nix-command flakes
      sandbox = true

runcmd:
  # One shell, so `set -eu` covers every step and the first failure
  # stops the boot instead of being followed by a success line.
  - |
    set -eu

    # cloud-init gives runcmd no login environment: HOME is unset and the Nix
    # installer refuses to run. Set it explicitly, for this shell and for every
    # step below. PATH is spelled out because a system shell here is not a login
    # shell: without it the freshly installed `/nix` profile bin is unreachable.
    export HOME=/root
    export USER=root
    export PATH="/nix/var/nix/profiles/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"

    # --- Nix daemon (S02) -----------------------------------------------------
    # Upstream multi-user installer: daemon plus /nix, the same installer the
    # EC2 bring-up notes use. `env HOME=/root USER=root` is spelled again on the
    # installer line on purpose: that line is the one the installer reads, and a
    # later edit that splits these steps must not lose the environment.
    mkdir -p /nix
    curl -fsSL https://nixos.org/nix/install -o /tmp/nix-install.sh
    test -s /tmp/nix-install.sh
    env HOME=/root USER=root sh /tmp/nix-install.sh --daemon --yes
    rm -f /tmp/nix-install.sh
    # Fails the boot when the installer did not deliver a usable client.
    command -v nix
    nix --version

    # The upstream installer rewrites /etc/nix/nix.conf, so the write_files copy
    # above is already gone here, and the file it leaves behind holds only
    # `build-users-group`. A remote deploy then dies on
    # `experimental Nix feature 'nix-command' is disabled`. Re-assert the feature
    # set once: the guard is what keeps a preserved file from gaining a duplicate
    # scalar setting, which Nix refuses on its own.
    grep -q '^experimental-features' /etc/nix/nix.conf \
      || printf '%s\n' 'experimental-features = nix-command flakes' >> /etc/nix/nix.conf
    # Proven with an evaluation that needs no network, no flake, and no store: the
    # command is unavailable until the feature is on, so a failed restore fails
    # the boot here instead of at the first deploy.
    test "$(nix eval --expr 1 --json)" = "1"

    # The remote deploy runs as a user unit with no login session.
    loginctl enable-linger ubuntu

    # --- tailscaled: explicit system bootstrap step (S03) ---------------------
    # Tailscale ships an apt repository; the official installer adds it and
    # installs the daemon. It is a *system* unit (`system tailscaled`),
    # deliberately not a Home Manager fragment: the daemon owns the tun device and
    # the state directory and must be up before any user profile is deployed.
    #
    # No credential is created or stored here. The node is not enrolled by this
    # file: enrollment happens later, from the worker, with a short-lived
    # single-use preauthorized key that the host reads from SSM Parameter Store
    # and writes to a tmpfs file that exists only for the length of one command.
    curl -fsSL https://tailscale.com/install.sh -o /tmp/tailscale-install.sh
    test -s /tmp/tailscale-install.sh
    env HOME=/root sh /tmp/tailscale-install.sh
    rm -f /tmp/tailscale-install.sh
    # Start at boot, before the enrollment step can reach the host.
    systemctl enable tailscaled
    systemctl start tailscaled
    # Readiness marker the worker may probe: the daemon's socket, never node
    # identity and never a credential. Exits non-zero, so it fails the boot.
    for i in $(seq 1 30); do
      if [ -S /var/run/tailscale/tailscaled.sock ]; then break; fi
      sleep 2
      if [ "$i" = 30 ]; then echo "tailscaled socket never appeared" >&2; exit 1; fi
    done

    # --- AWS CLI v2 (S04 SSM enrollment) -------------------------------------
    # The enrollment script runs as the SSM agent (root) and reads one SecureString
    # parameter from Parameter Store. Ubuntu 24.04 ships the AWS CLI only as
    # a snap, and an enrollment command that cannot find it fails closed and fails
    # the job, so install it during bootstrap rather than at enrollment time.
    snap install aws-cli --classic
    aws --version

    # Reached only when every step above passed. This is the success report: a
    # failed install exits non-zero above and never prints this line, and there is
    # no static message behind it that would print "complete" anyway.
    echo "fleet bootstrap complete: nix daemon, tailscaled, and the aws cli are installed; the node is not enrolled yet"
