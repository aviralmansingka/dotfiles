[project]
name = "tasktrace"
version = "0.1.0"
description = "Collect attention spans from app focus, AeroSpace and rex"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project.scripts]
tasktrace = "tasktrace.cli:main"
tasktrace-hook = "tasktrace.cli:hook_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
