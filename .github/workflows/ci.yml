name: CI

# Fast, deterministic checks for the surfaces an agent actually touches:
# shell/python scripts, neovim lua config, and Pi TS extensions.
# The Packer AMI pipeline was removed; Terraform plan/apply stays path-gated
# in its own workflow. This workflow runs every offline repo test.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Shell syntax (bash/sh -n)
        run: |
          set +e
          fail=0
          # .sh files plus extensionless scripts under scripts/ with a bash/sh shebang.
          while IFS= read -r f; do
            sb=$(head -1 "$f")
            case "$sb" in
              '#!/bin/sh'|'#!/usr/bin/env sh') sh -n "$f" || { echo "FAIL $f"; fail=1; } ;;
              *) bash -n "$f" || { echo "FAIL $f"; fail=1; } ;;
            esac
          done < <(git ls-files '*.sh')
          while IFS= read -r f; do
            sb=$(head -1 "$f" 2>/dev/null)
            case "$sb" in
              '#!/bin/bash'|'#!/usr/bin/env bash') bash -n "$f" || { echo "FAIL $f"; fail=1; } ;;
              '#!/bin/sh'|'#!/usr/bin/env sh') sh -n "$f" || { echo "FAIL $f"; fail=1; } ;;
            esac
          done < <(git ls-files 'scripts/*')
          exit $fail

      - name: Python syntax (py_compile)
        run: |
          set +e
          fail=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "FAIL $f"; fail=1; }
          done < <(git ls-files '*.py')
          exit $fail

      - name: Lua syntax (nvim loadfile parse-only)
        run: |
          set +e
          fail=0
          # Parse-only via loadfile: catches syntax errors in neovim's lua
          # dialect without bootstrapping plugins (deterministic, no network).
          while IFS= read -r f; do
            nvim --headless -u NONE -c "lua local fn,err=loadfile('$f'); if not fn then io.stderr:write(tostring(err)..'\n'); vim.cmd('cquit 1') else vim.cmd('qa') end" 2>&1 \
              || { echo "FAIL $f"; fail=1; }
          done < <(git ls-files '*.lua')
          exit $fail

  extensions:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install jiti and typebox
        run: npm install --prefix "$RUNNER_TEMP/jiti-root" jiti@2 typebox@1.3.27

      - name: Run extension tests
        env:
          JITI_PATH: ${{ runner.temp }}/jiti-root/node_modules/jiti/lib/jiti.cjs
          NODE_PATH: ${{ runner.temp }}/jiti-root/node_modules
        run: |
          node pi/.pi/agent/extensions/cleanup.test.mjs
          node pi/.pi/agent/extensions/explain.test.mjs
          node pi/.pi/agent/extensions/focus-buffer.test.mjs
          node pi/.pi/agent/extensions/herdr-prompt-state.test.mjs
          node pi/.pi/agent/extensions/hunk-open.test.mjs
          node pi/.pi/agent/extensions/interactive-subagents.test.mjs
          node pi/.pi/agent/extensions/lesson.test.mjs
          node pi/.pi/agent/extensions/md-log.test.mjs
          node pi/.pi/agent/extensions/mermaid.test.mjs
          node pi/.pi/agent/extensions/no-mistakes-gate.test.mjs
          node pi/.pi/agent/extensions/no-mistakes-pane.test.mjs
          node pi/.pi/agent/extensions/nvim-open.test.mjs
          node pi/.pi/agent/extensions/quiz-context-files.test.mjs
          node pi/.pi/agent/extensions/quiz-result.test.mjs
          node pi/.pi/agent/extensions/run-command.test.mjs
          node pi/.pi/agent/extensions/thinking-blank.test.mjs
          node pi/.pi/agent/extensions/tool-call-renderer-public.test.mjs
          node pi/.pi/agent/extensions/tuicr.test.mjs
          node pi/.pi/agent/extensions/usage.test.mjs
          node pi/.pi/agent/extensions/user-input/input-modes.test.mjs
          node pi/.pi/agent/extensions/user-input/option-navigation.test.mjs
          node pi/.pi/agent/extensions/user-input/option-shortcuts.test.mjs
          node pi/.pi/agent/extensions/web-fetch/web-fetch.test.mjs
          node pi/.pi/agent/extensions/web-search/web-search.test.mjs

  scripts-tests:
    name: Scripts tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: auto-git-sync tests
        run: bash scripts/test-auto-git-sync.sh

      - name: gh-dash-open-pr tests (ruby is preinstalled on ubuntu runners)
        run: bash scripts/test-gh-dash-open-pr.sh

      - name: herdr-clean-handoff tests
        run: |
          sudo apt-get update && sudo apt-get install -y zsh
          bash scripts/test-herdr-clean-handoff.sh

      - name: herdr-flash-copy tests
        run: bash scripts/test-herdr-flash-copy.sh

      - name: herdr-annotate-install tests
        run: python3 scripts/test-herdr-annotate-install.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pi live-config tests
        run: |
          sudo apt-get update && sudo apt-get install -y stow
          node scripts/test-pi-live-config.mjs
          node scripts/test-pi-hidden-thinking.mjs

      - name: Pi telegram daemon tests
        run: python3 -m unittest discover -s pi/bin -p 'test_pi_telegram_daemon.py'
